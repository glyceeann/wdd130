<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
<header>
    <h1>Basic HTML and CSS Quiz</h1>
</header>
<main>
    <form>
        <div class="quiz-item">
            <label for="q1">1. What does the acronym CSS stand for?</label>
            <input type="text" id="q1" name="q1" required>
        </div>

        <div class="quiz-item">
            <label for="q2">2. How are id and class attributes selected in CSS?</label>
            <textarea id="q2" name="q2" rows="4" placeholder="Explain briefly..." required></textarea>
        </div>

        <div class="quiz-item">
            <label for="q3">3. Which of the following is a valid CSS comment?</label>
            <select id="q3" name="q3" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="a">/* Comment */</option>
                <option value="b">// Comment</option>
                <option value="c"># Comment</option>
            </select>
        </div>

        <div class="quiz-item">
            <label for="q4">4. What is the bottom margin given this declaration: margin: 10px 5px 15px;</label>
            <input type="number" id="q4" name="q4" min="0" required>
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</main>
<footer>
    <p>©2026 | HTML Form - Quiz | Glycee Ann Picar</p>
</footer>
</body>
</html>
