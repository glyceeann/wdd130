<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapids White Water Rafting</title>
    <meta name="description"
      content="Contact Rapids White Water Rafting for general inquiries, reservation questions, and website suggestions.">
    <meta name="author" content="Glycee Ann Bullecer Picar">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- header -->
    <header>
        <img src="images/logo.png" alt="Rapids Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- main content -->
    <main>

        <!-- part 1 - company address -->
        <div class="company-info">
            <h1>Rapids White Water Rafting</h1>
            <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com
            </p>
        </div>

        <!-- part 2 - map and form side by side -->
        <div class="contact-wrapper">
            <!-- map -->
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps?q=Kolob%20Canyon%20Road,%20Kolob,%20California&z=12&output=embed"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="White Water Rafting Location - Kolob, California"></iframe>
            </div>

            <!-- contact form - must be inside main -->
            <form class="contact-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                </div>
                <div class="field">
                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="How can we help you?"></textarea>
                </div>
                <div class="check">
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <!-- part 3 - employees -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="emp-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Emily Carter - Lead River Guide">
                    <figcaption>Emily Carter<br><span>Lead Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="James Miller - Safety Manager">
                    <figcaption>James Miller<br><span>Safety Manager</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Alex Rivera - Customer Support">
                    <figcaption>Alex Rivera<br><span>Customer Support</span></figcaption>
                </figure>
            </div>
        </section>

    </main>

    <!-- footer -->
    <footer>
        <p>&copy; 2026 Rapids White Water Rafting | Glycee Ann Bullecer Picar</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook logo"></a>
            <a href="https://twitter.com"><img src="images/twitter.svg" alt="Twitter logo"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram logo"></a>
        </nav>
    </footer>

</body>

</html>
